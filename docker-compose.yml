services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: web
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=${PORT_FE:-5173}
      - HOST=${HOST}
      - VITE_API_URL=${VITE_API_URL:-/api}
      - BACKEND_HOST=backend
    ports:
      - "5173:${PORT_FE:-5173}"
    volumes:
      - ./web:/app
      - /app/node_modules
    command: sh -c "npm run dev -- --host"
    depends_on:
      - backend
    networks:
      - app-net

  backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: backend
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=${PORT_BE:-8017}
      - HOST=${HOST}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@database:${DB_PORT:-5432}/${DB_NAME}?schema=public
    ports:
      - "8017:${PORT_BE:-8017}"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npx prisma generate && npx prisma db push && npm run dev"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  db:
    image: postgres:16-alpine
    container_name: database
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:

networks:
  app-net:
    driver: bridge
