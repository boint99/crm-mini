services:
  web:
    build:
      context: ./web
      dockerfile: docker/Dockerfile
    container_name: web
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=${PORT_FE}
      - HOST=0.0.0.0
    ports:
      - "${PORT_FE}:${PORT_FE}"
    volumes:
      - ./web:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    networks:
      - app-net

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: backend
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=${PORT_BE}
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "${PORT_BE}:${PORT_BE}"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npx prisma generate && npm run dev"
    networks:
      - app-net

  db:
    image: postgres:16
    container_name: database
    profiles:
      - local-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:

networks:
  app-net:
    driver: bridge