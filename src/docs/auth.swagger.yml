paths:
  # ========================
  # AUTH APIs
  # ========================
  /api/auth/register:
    post:
      summary: Register account
      description: Register a new account.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        201:
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        400:
          description: Invalid input or passwords do not match
        409:
          description: Account already exists or email already registered

  /api/auth/login:
    post:
      summary: Log in
      description: Log in using email and password.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        200:
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                description: HTTP-only cookie containing the refreshToken
        401:
          description: Invalid credentials or account not active/activated

  /api/auth/refresh-token:
    post:
      summary: Refresh access token
      description: Get a new access token using the refresh token from cookie or request body.
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        200:
          description: Token refreshed successfully
        401:
          description: Invalid or expired refresh token

  /api/auth/forgot-password:
    put:
      summary: Forgot password (reset password)
      description: Reset password using a valid OTP token.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordInput'
      responses:
        200:
          description: Password reset successfully
        400:
          description: Invalid parameters or mismatch
        404:
          description: OTP not found or account not found
        401:
          description: OTP expired or invalid

  /api/auth/logout:
    post:
      summary: Log out
      description: Revoke the refresh token and clear the cookie.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        200:
          description: Logged out successfully

  /api/auth/logout-all:
    post:
      summary: Log out from all devices
      description: Revoke all refresh tokens for the account and clear the cookie.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        200:
          description: Logged out from all devices

  /api/auth/setup-superadmin:
    post:
      summary: Setup superadmin
      description: Set up a default superadmin account if none exists.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        201:
          description: Superadmin created successfully
        403:
          description: Superadmin already exists

  # ========================
  # OTP APIs
  # ========================
  /api/otp/generate:
    post:
      summary: Generate OTP
      description: Generate an OTP code for password reset or registration and send it via email.
      tags:
        - OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateOtpInput'
      responses:
        200:
          description: OTP generated successfully
        400:
          description: Invalid parameters (email is required)
        404:
          description: Email not found (for forgot-password or reset-password)
        403:
          description: Account is not activated / not active, or email already exists (for register)

components:
  schemas:
    RegisterInput:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
        - confirmPassword
      properties:
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        email:
          type: string
          format: email
          example: "john.doe@crm.com"
        password:
          type: string
          format: password
          example: "password123"
        confirmPassword:
          type: string
          format: password
          example: "password123"

    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "superadmin@crm.com"
        password:
          type: string
          format: password
          example: "password123"

    ForgotPasswordInput:
      type: object
      required:
        - email
        - otp
        - newPassword
        - reNewPassword
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        otp:
          type: string
          example: "123456"
        newPassword:
          type: string
          format: password
          example: "newpassword123"
        reNewPassword:
          type: string
          format: password
          example: "newpassword123"
        action:
          type: string
          example: "RESET_PASSWORD"

    GenerateOtpInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        action:
          type: string
          example: "RESET_PASSWORD"
        acction:
          type: string
          example: "RESET_PASSWORD"
        typeOtp:
          type: string
          example: "RESET_PASSWORD"
