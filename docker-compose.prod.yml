services:
  web:
    build:
      context: ./web
      dockerfile: ./docker/Dockerfile.prod
    container_name: web
    ports:
      - "${PORT_FE:-5173}:${PORT_FE:-5173}"
    restart: always
    networks:
      - app-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`it-heodesk.vienthongact.vn`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=8080"

  backend:
    command: >
      sh -c "
        echo 'DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}?schema=public' > /app/.env &&
        npx prisma migrate deploy &&
        node src/server.js
      "
    build:
      context: .
      dockerfile: ./docker/Dockerfile.prod
    container_name: backend
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT_BE:-8017}
      - HOST=${HOST}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}?schema=public
    ports:
      - "${PORT_BE:-8017}:${PORT_BE:-8017}"
    restart: always
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`it-heodesk.vienthongact.vn`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=myresolver"
      - "traefik.http.services.backend.loadbalancer.server.port=${PORT_BE:-8017}"

  db:
    image: postgres:16-alpine
    container_name: database
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=boint@vienthongact.vn"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.websecure.ipwhitelist.sourcerange=10.0.0.0/8, 192.168.0.0/16"
      - "--entrypoints.websecure.ratelimit.average=100"
      - "--entrypoints.websecure.ratelimit.burst=50"
      - "--entrypoints.websecure.headers.customframeoptionsvalue=SAMEORIGIN"
      - "--entrypoints.websecure.headers.contenttypenosniff=true"
      - "--entrypoints.websecure.headers.browserxssfilter=true"
      - "--entrypoints.websecure.headers.forceststheader=true"
      - "--entrypoints.websecure.headers.stsseconds=31536000"
      - "--entrypoints.websecure.headers.stsincludesubdomains=true"
      - "--entrypoints.websecure.headers.stspreload=true"
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--api.dashboard=false"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
      - ./logs:/var/log/traefik
    networks:
      - app-net

volumes:
  pgdata:

networks:
  app-net:
    driver: bridge
