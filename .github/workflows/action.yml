name: Github CI CRM_MINI

on:
  push:
    branches: [ "deploy" ]

jobs:
  # ==================== JOB 1: LINT ====================
  lint:
    name: Lint Code
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if .env file is committed
        run: |
          if [ -f .env ] || [ -f web/.env ]; then
            echo "ERROR: .env file should not be committed to the repository!"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install backend dependencies
        run: npm install

      - name: Run backend lint
        run: npm run lint

      - name: Install frontend dependencies
        working-directory: ./web
        run: npm install

      - name: Run frontend lint
        working-directory: ./web
        run: npm run lint

  # ==================== JOB 2: SETUP ENV ====================
  setup-env:
    name: Setup Backend Environment
    runs-on: self-hosted
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create backend .env from GitHub Secrets
        run: |
          echo "========================================="
          echo "  SETUP BACKEND .ENV FROM SECRETS"
          echo "========================================="

          # Lấy IP tự động
          HOST_IP=$(hostname -I | awk '{print $1}')
          echo "📍 Detected IP: $HOST_IP"

          printf '%s\n' \
            "DB_USER=${{ secrets.DB_USER }}" \
            "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            "DB_NAME=${{ secrets.DB_NAME }}" \
            "DB_HOST=db" \
            "DB_PORT=${{ secrets.DB_PORT }}" \
            "PORT_BE=${{ secrets.PORT_BE }}" \
            "PORT_FE=${{ secrets.PORT_FE }}" \
            "MAIL_HOST=${{ secrets.MAIL_HOST }}" \
            "MAIL_PORT=${{ secrets.MAIL_PORT }}" \
            "SMTP_USER=${{ secrets.SMTP_USER }}" \
            "SMTP_PASS=${{ secrets.SMTP_PASS }}" \
            "JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}" \
            "JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}" \
            "JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}" \
            "JWT_REFRESH_EXPIRES_IN=${{ secrets.JWT_REFRESH_EXPIRES_IN }}" \
            "VITE_API_URL=${{ secrets.VITE_API_URL }}" \
            "HOST=${HOST_IP}" \
            > .env

          echo "✅ Backend .env created"

          echo "[2/2] Generating DATABASE_URL..."
          set -a
          source .env
          set +a

          if command -v python3 &> /dev/null; then
              DB_PASSWORD_ENCODED=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ.get('DB_PASSWORD', ''), safe=''))")
              echo "✅ Password encoded using Python"
          else
              DB_PASSWORD_ENCODED=$(echo "${DB_PASSWORD}" | sed 's/ /%20/g' | sed 's/#/%23/g' | sed 's/?/%3F/g' | sed 's/&/%26/g' | sed 's/=/%3D/g')
              echo "⚠️ Python not found, using manual encoding"
          fi

          DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD_ENCODED}@${DB_HOST}:${DB_PORT}/${DB_NAME}?schema=public"

          if grep -q "^DATABASE_URL=" .env; then
              sed -i "s|^DATABASE_URL=.*|DATABASE_URL=\"$DATABASE_URL\"|" .env
          else
              echo "DATABASE_URL=\"$DATABASE_URL\"" >> .env
          fi

          echo "✅ DATABASE_URL updated"

          echo "========================================="
          echo "  VERIFICATION"
          echo "========================================="
          ls -la .env
          grep "^HOST=" .env
          echo "✅ Backend environment setup completed!"

      - name: Display .env content (masked)
        run: |
          echo "========================================="
          echo "  .ENV CONTENT (MASKED)"
          echo "========================================="
          if [ -f .env ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              if [[ "$line" =~ ^[[:space:]]*# ]] || [[ -z "$line" ]]; then
                echo "$line"
              elif [[ "$line" =~ ^[[:space:]]*(DB_PASSWORD|JWT_ACCESS_SECRET|JWT_REFRESH_SECRET|SMTP_PASS|DATABASE_URL)= ]]; then
                key="${line%%=*}"
                echo "$key=********"
              else
                echo "$line"
              fi
            done < .env
          else
            echo "❌ .env file not found!"
            exit 1
          fi

      - name: Upload .env as artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: env-files
          path: .env
          include-hidden-files: true
          retention-days: 1
  # ==================== JOB 3: BUILD BACKEND ====================
  build-backend:
    name: Build Backend
    runs-on: self-hosted
    needs: setup-env
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Download .env files
        uses: actions/download-artifact@v4
        with:
          name: env-files
          path: .

      - name: Install backend dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build backend
        run: npm run build || echo "No build script for backend"

  # ==================== JOB 4: BUILD FRONTEND ====================
  build-frontend:
    name: Build Frontend
    runs-on: self-hosted
    needs: setup-env
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Download .env files
        uses: actions/download-artifact@v4
        with:
          name: env-files
          path: .

      - name: Install frontend dependencies
        working-directory: ./web
        run: npm install

      - name: Build frontend
        working-directory: ./web
        run: npm run build

  # ==================== JOB 5: DEPLOY ====================
  deploy:
    name: Deploy Application
    runs-on: self-hosted
    needs: [build-backend, build-frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download .env files
        uses: actions/download-artifact@v4
        with:
          name: env-files
          path: .

      - name: Deploy with Docker Compose
        run: |
          docker compose -f docker-compose.prod.yml down
          docker compose -f docker-compose.prod.yml up -d --build

      - name: Verify Deployment
        run: |
          sleep 10
          docker compose -f docker-compose.prod.yml ps

  # ==================== JOB 6: CLEANUP ====================
  cleanup:
    name: Cleanup
    runs-on: self-hosted
    needs: [deploy]
    if: always()
    steps:
      - name: Remove dangling images
        run: docker image prune -af