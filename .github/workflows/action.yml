name: Github CI

on:
  push:
    branches: [ "deploy" ]

jobs:
  lint:
    name: Lint Code
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if .env file is committed
        run: |
          if [ -f .env ] || [ -f web/.env ]; then
            echo "ERROR: .env file should not be committed to the repository!"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install backend dependencies
        run: |
          npm install

      - name: Run backend lint
        run: npm run lint

      - name: Install frontend dependencies
        working-directory: ./web
        run: npm ci

      - name: Run frontend lint
        working-directory: ./web
        run: npm run lint

  setup:
    name: Setup & Build
    needs: lint
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: create .env
        run: |
          touch .env
          echo "PORT=${{ env.PORT }}" >> .env
          echo "NODE_ENV=${{ env.NODE_ENV }}" >> .env
          echo "DATABASE_URL=${{ env.DATABASE_URL }}" >> .env
          echo "DB_USER=${{ env.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ env.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ env.DB_NAME }}" >> .env
          echo "DB_HOST=${{ env.DB_HOST }}" >> .env
          echo "DB_PORT=${{ env.DB_PORT }}" >> .env
          echo "JWT_ACCESS_SECRET=${{ env.JWT_ACCESS_SECRET }}" >> .env
          echo "JWT_EXPIRES_IN=${{ env.JWT_EXPIRES_IN }}" >> .env
          echo "JWT_REFRESH_SECRET=${{ env.JWT_REFRESH_SECRET }}" >> .env
          echo "JWT_REFRESH_EXPIRES_IN=${{ env.JWT_REFRESH_EXPIRES_IN }}" >> .env
          echo "MAIL_HOST=${{ env.MAIL_HOST }}" >> .env
          echo "MAIL_PORT=${{ env.MAIL_PORT }}" >> .env
          echo "SMTP_USER=${{ env.SMTP_USER }}" >> .env
          echo "SMTP_PASS=${{ env.SMTP_PASS }}" >> .env

      - name: check ip server
        run: |
          chmod +x server.sh
          ./server.sh

      - name: Install backend dependencies
        run: npm  install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Install frontend dependencies
        working-directory: ./web
        run: npm ci

      - name: Build frontend
        working-directory: ./web
        run: npm run build

  deploy:
    name: Deploy Application
    needs: setup
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        run: |
          #Docker Compose Deployment
          docker compose -f docker-compose.prod.yml down
          docker compose -f docker-compose.prod.yml up -d --build

      - name: Remove dangling images
        run: docker image prune -af
