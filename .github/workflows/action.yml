name: Github CI

on:
  push:
    branches: [ "deploy" ]

jobs:
  # ==================== JOB 1: LINT ====================
  lint:
    name: Lint Code
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if .env file is committed
        run: |
          if [ -f .env ] || [ -f web/.env ]; then
            echo "ERROR: .env file should not be committed to the repository!"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install backend dependencies
        run: npm install

      - name: Run backend lint
        run: npm run lint

      - name: Install frontend dependencies
        working-directory: ./web
        run: npm install

      - name: Run frontend lint
        working-directory: ./web
        run: npm run lint

  # ==================== JOB 2: SETUP ENV ====================
  setup-env:
    name: Setup Environment Variables
    runs-on: self-hosted
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env for backend
        run: |
          touch .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
          echo "PORT_BE=${{ secrets.PORT_BE }}" >> .env
          echo "PORT_FE=${{ secrets.PORT_FE }}" >> .env
          echo "MAIL_HOST=${{ secrets.MAIL_HOST }}" >> .env
          echo "MAIL_PORT=${{ secrets.MAIL_PORT }}" >> .env
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> .env
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> .env
          echo "JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}" >> .env
          echo "JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}" >> .env
          echo "JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}" >> .env
          echo "JWT_REFRESH_EXPIRES_IN=${{ secrets.JWT_REFRESH_EXPIRES_IN }}" >> .env
          echo "HOST=$(hostname -I | awk '{print $1}')" >> .env

      - name: Create web/.env for frontend
        run: |
          cat << 'EOF' > web/.env
          VITE_API_URL=/api
          EOF

      - name: Upload .env files
        uses: actions/upload-artifact@v4
        with:
          name: env-files
          path: |
            .env
            web/.env
          retention-days: 1

  # ==================== JOB 3: BUILD BACKEND ====================
  build-backend:
    name: Build Backend
    runs-on: self-hosted
    needs: setup-env
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Download .env files
        uses: actions/download-artifact@v4
        with:
          name: env-files
          path: .

      - name: Install backend dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build backend
        run: npm run build || echo "No build script for backend"

      - name: Deploy Backend
        run: |
          docker compose -f docker-compose.prod.yml up -d --build backend

  # ==================== JOB 4: BUILD FRONTEND ====================
  build-frontend:
    name: Build Frontend
    runs-on: self-hosted
    needs: setup-env
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Download .env files
        uses: actions/download-artifact@v4
        with:
          name: env-files
          path: .

      - name: Install frontend dependencies
        working-directory: ./web
        run: npm install

      - name: Build frontend
        working-directory: ./web
        run: npm run build

      - name: Deploy Frontend
        run: |
          docker compose -f docker-compose.prod.yml up -d --build web

  # ==================== JOB 5: CLEANUP ====================
  cleanup:
    name: Cleanup
    runs-on: self-hosted
    needs: [build-backend, build-frontend]
    if: always()
    steps:
      - name: Remove dangling images
        run: docker image prune -af