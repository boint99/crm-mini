name: Github CI

on:
  push:
    branches: [ "deploy_stop" ]

jobs:
  # ==================== JOB 1: LINT ====================
  lint:
    name: Lint Code
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if .env file is committed
        run: |
          if [ -f .env ] || [ -f web/.env ]; then
            echo "ERROR: .env file should not be committed to the repository!"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install backend dependencies
        run: npm install

      - name: Run backend lint
        run: npm run lint

      - name: Install frontend dependencies
        working-directory: ./web
        run: npm install

      - name: Run frontend lint
        working-directory: ./web
        run: npm run lint

  # ==================== JOB 2: SETUP ENV ====================
  setup-env:
    name: Setup Environment Variables
    runs-on: self-hosted
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env files
        run: |
          cat > create_env.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          
          echo "Creating backend .env..."
          cat > .env << EOF
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_PORT=${{ secrets.DB_PORT }}
          PORT_BE=${{ secrets.PORT_BE }}
          PORT_FE=${{ secrets.PORT_FE }}
          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ secrets.MAIL_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
          JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          JWT_REFRESH_EXPIRES_IN=${{ secrets.JWT_REFRESH_EXPIRES_IN }}
          HOST=$(hostname -I | awk '{print $1}')
          EOF
          
          echo "Creating frontend .env..."
          mkdir -p web
          cat > web/.env << EOF
          VITE_API_URL=/api
          EOF
          
          echo "=== Verification ==="
          ls -la .env web/.env
          SCRIPT
          
          chmod +x create_env.sh
          ./create_env.sh

      - name: Validate .env files
        run: |
          if [ ! -s .env ]; then echo "❌ .env is empty"; exit 1; fi
          for var in DB_USER DB_PASSWORD DB_NAME PORT_BE; do
            grep -q "^$var=" .env || { echo "❌ $var missing"; exit 1; }
          done
          grep -q "VITE_API_URL" web/.env || { echo "❌ VITE_API_URL missing"; exit 1; }
          echo "✅ All validations passed!"

      - name: Upload .env files
        uses: actions/upload-artifact@v4
        with:
          name: env-files
          path: |
            .env
            web/.env
          retention-days: 1

  # ==================== JOB 3: BUILD BACKEND ====================
  build-backend:
    name: Build Backend
    runs-on: self-hosted
    needs: setup-env
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Download .env files
        uses: actions/download-artifact@v4
        with:
          name: env-files
          path: .

      - name: Install backend dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build backend
        run: npm run build || echo "No build script for backend"

  # ==================== JOB 4: BUILD FRONTEND ====================
  build-frontend:
    name: Build Frontend
    runs-on: self-hosted
    needs: setup-env
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Download .env files
        uses: actions/download-artifact@v4
        with:
          name: env-files
          path: .

      - name: Install frontend dependencies
        working-directory: ./web
        run: npm install

      - name: Build frontend
        working-directory: ./web
        run: npm run build

  # ==================== JOB 5: DEPLOY ====================
  deploy:
    name: Deploy Application
    runs-on: self-hosted
    needs: [build-backend, build-frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download .env files
        uses: actions/download-artifact@v4
        with:
          name: env-files
          path: .

      - name: Deploy with Docker Compose
        run: |
          docker compose -f docker-compose.prod.yml down
          docker compose -f docker-compose.prod.yml up -d --build

      - name: Verify Deployment
        run: |
          sleep 10
          docker compose -f docker-compose.prod.yml ps

  # ==================== JOB 6: CLEANUP ====================
  cleanup:
    name: Cleanup
    runs-on: self-hosted
    needs: [deploy]
    if: always()
    steps:
      - name: Remove dangling images
        run: docker image prune -af